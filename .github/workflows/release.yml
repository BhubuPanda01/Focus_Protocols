name: Build and Release Dopamine Zero Desktop V1

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Build Windows Executable
        run: npx electron-builder --win portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Dopamine Zero V1.0.0
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            # ⚡ DOPAMINE ZERO — V1.0.0 RELEASE
            > *"Zero feeds. Pure execution. Earn your focus."*

            ### 🚀 Highlights
            * **Offline-First Desktop App**: Native Windows desktop edition powered by Electron.
            * **7-Day Combat Cycle**: Progressive challenges from Day 1 (Cold Start) through Day 7 (The Boss Battle).
            * **Urge Intercept Protocol**: 60-second breathing & grounding mechanism ("I WANT TO SCROLL").
            * **Class Mode**: Dedicated toggle authorizing phone usage for online class participation without penalties.
            * **Tactical Focus Timer**: Circular HUD timer with mandatory task definition and strict integrity checks.
            * **Zero Cloud Dependencies**: 100% private with local persistence and JSON backup support.

            ### 📦 Download Assets
            Download the standalone Windows `.exe` below to run Dopamine Zero natively on your desktop.
          files: |
            release/*.exe
